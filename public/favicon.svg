<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background circle -->
  <rect width="32" height="32" rx="7" fill="#121212"/>
  <!-- Parquet/table icon: three horizontal data rows -->
  <!-- Top row (header) -->
  <rect x="5" y="7" width="22" height="5" rx="1.5" fill="#d4fa00"/>
  <!-- Middle row -->
  <rect x="5" y="14" width="22" height="4" rx="1" fill="#d4fa00" opacity="0.55"/>
  <!-- Bottom row -->
  <rect x="5" y="20" width="22" height="4" rx="1" fill="#d4fa00" opacity="0.3"/>
  <!-- Vertical column divider -->
  <rect x="13" y="7" width="1.5" height="17" rx="0.75" fill="#121212" opacity="0.6"/>
</svg>
