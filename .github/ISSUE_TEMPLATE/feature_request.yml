name: Feature Request
description: Suggest an improvement or new feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, please check existing issues and discussions.
        Remember: all features must keep processing 100% client-side.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: I often need to... but currently I have to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: It would be great if...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: I also thought about...

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: This feature keeps all processing client-side (no server calls for user data)
          required: true
        - label: This feature does not add telemetry or tracking
          required: true
